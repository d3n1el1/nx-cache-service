services:
  nx-cache-service:
    build: .
    image: nx-cache-service
    ports:
      - "8080:8080"
    environment:
      CI_TOKEN: ${CI_TOKEN:-dev-ci-token}
      READ_ONLY_TOKEN: ${READ_ONLY_TOKEN:-}
      CACHE_STORE: ${CACHE_STORE:-disk}
    volumes:
      - cache:/app/.nx-cache-service
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  cache:
