openapi: 3.0.0

info:
  title: Nx Cache Service
  description: >
    Self-hosted remote cache for Nx computation artifacts. Implements the Nx
    custom remote cache specification v1.0.0, extended with a liveness probe
    and with the error responses this server actually emits.
  version: 0.1.0

servers:
  - url: http://localhost:8080

paths:
  /v1/cache/{hash}:
    parameters:
      - $ref: '#/components/parameters/Hash'

    get:
      operationId: get
      summary: Download a task output
      description: Download a task output
      security:
        - bearerToken: []
      responses:
        '200':
          description: Successfully retrieved cache artifact
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: An octet stream with the content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The record was not found
          content:
            text/plain:
              schema:
                type: string
                description: Error message provided to the Nx CLI user

    put:
      operationId: put
      summary: Upload a task output
      description: >
        Upload a task output. Records are immutable: uploading a hash that is
        already stored leaves the stored artifact untouched and reports a
        conflict.
      security:
        - bearerToken: []
      parameters:
        - $ref: '#/components/parameters/ContentLength'
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Successfully uploaded the output
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Cannot override an existing record
          content:
            text/plain:
              schema:
                type: string
                description: Error message provided to the Nx CLI user
        '413':
          description: The artifact exceeds the configured size limit.
          content:
            text/plain:
              schema:
                type: string
                description: Error message provided to the Nx CLI user

  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Not part of the Nx remote cache specification.
      security: []
      responses:
        '200':
          description: The service is up.

components:
  securitySchemes:
    bearerToken:
      type: http
      description: Auth mechanism
      scheme: bearer

  parameters:
    Hash:
      name: hash
      description: The task hash corresponding to the uploaded task output
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,128}$'

    ContentLength:
      name: Content-Length
      description: The file size in bytes
      in: header
      required: true
      schema:
        type: number

  responses:
    BadRequest:
      description: The hash is not a well-formed cache key.
      content:
        text/plain:
          schema:
            type: string
            description: Error message provided to the Nx CLI user
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        text/plain:
          schema:
            type: string
            description: Error message provided to the Nx CLI user
    Forbidden:
      description: Access forbidden. (e.g. read-only token used to write)
      content:
        text/plain:
          schema:
            type: string
            description: Error message provided to the Nx CLI user
