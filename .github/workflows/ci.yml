name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make check

      - run: make build

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Resolve image tags
        id: image
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/master" ]; then
            push=true
            set -- "$image:$SHA" "$image:latest"
          elif [ "$EVENT" = "pull_request" ] && [ "$PR_HEAD_REPO" = "$REPOSITORY" ]; then
            push=true
            set -- "$image:pr-$SHA" "$image:pr-$PR_NUMBER-latest"
          else
            push=false
            set -- "nx-cache-service:ci"
          fi

          echo "push=$push" >> "$GITHUB_OUTPUT"

          {
            echo "tags<<TAGS"
            printf '%s\n' "$@"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.image.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.image.outputs.push == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
